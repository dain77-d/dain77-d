name: omok

on:
  issues:
    types: [opened]

# 동시에 들어온 수는 한 줄로 세워 처리
concurrency: omok

permissions:
  contents: write
  issues: write

jobs:
  move:
    if: startsWith(github.event.issue.title, 'omok|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: apply move
        env: # 이슈 제목은 외부 입력 → run 에 직접 넣지 않고 env 로만 전달
          TITLE: ${{ github.event.issue.title }}
          ACTOR: ${{ github.event.issue.user.login }}
        run: python games/omok.py

      - name: commit board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md games/omok.json
          git diff --cached --quiet || git commit -m "omok: ${ACTOR}"
          git pull --rebase && git push  # metrics 커밋과 겹쳐도 안전하게
        env:
          ACTOR: ${{ github.event.issue.user.login }}

      - name: reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" --comment "$(cat msg.txt) — [프로필로 돌아가기](https://github.com/${{ github.repository_owner }})"
