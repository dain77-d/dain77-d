# 뱀 + 팩맨을 한 번에 만들어 output 브랜치에 올림.
# (따로 두면 두 워크플로가 output 브랜치를 서로 덮어씀)
name: contrib-art

on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST
  workflow_dispatch:
  push: # 이 파일을 바꿔서 올릴 때도 바로 한 번 생성
    branches: [main]
    paths: [.github/workflows/contrib-art.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1 # main, 2026-11-11
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
